name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: npm run build:mac

      - name: Verify macOS build output
        run: |
          if ! ls dist/*.dmg 1> /dev/null 2>&1; then
            echo "DMG file not found!"
            exit 1
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-dmg
          path: dist/*.dmg
          retention-days: 1

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run build:win

      - name: Verify Windows build output
        run: |
          if (!(Test-Path "dist\*.exe")) {
            Write-Error "EXE file not found!"
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/*.exe
          retention-days: 1

  create-release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: mac-dmg
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-exe
          path: dist/

      - name: List downloaded files
        run: ls -lah dist/

      - name: Get previous tag
        id: previoustag
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: releasenotes
        run: |
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          git log ${{ steps.previoustag.outputs.tag }}..${{ github.ref_name }} --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.previoustag.outputs.tag }}...${{ github.ref_name }}" >> release_notes.md
          cat release_notes.md
          {
            echo 'notes<<EOF'
            cat release_notes.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.releasenotes.outputs.notes }}
          files: |
            dist/*.dmg
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
